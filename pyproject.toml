[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.1.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry]
name = "colibri_n3fit"
version = "0.0.1"
authors = ["Ella Cole"]
description = "Example NN PDF Model"

[tool.poetry.dependencies]

# colibri needs to be installed from git
colibri = { git = "https://github.com/HEP-PBSP/colibri" }

# Use the local SIMUnet checkout containing the shared SMEFT helpers.
simunet = { path = "../../codes/simunet/simunet_nnpdf", develop = true }

[tool.poetry.extras]
test = [
    "pytest",
    "hypothesis",
]
doc = [
    "sphinx",
    "recommonmark",
    "sphinx_rtd_theme"
]

[tool.poetry.scripts]
colibri_n3fit = "colibri_n3fit.app:main"
