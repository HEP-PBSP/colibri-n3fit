theoryid: 40000000                          # The theory from which the predictions are drawn.
use_cuts: internal                     # The kinematic cuts to be applied to the data.

closure_test_level: 0                  # The closure test level: False for experimental, level 0
                                       # for pseudodata with no noise, level 1 for pseudodata with
                                       # noise.
closure_test_pdf: NNPDF40_nnlo_as_01180 # The closure test PDF used if closure_level is not False

#####################
# Loss function specs
#####################

positivity:
  posdatasets:
  # Positivity Lagrange Multiplier
  - {dataset: NNPDF_POS_2P24GEV_F2U, maxlambda: 1e6}
  - {dataset: NNPDF_POS_2P24GEV_F2D, maxlambda: 1e6}
  - {dataset: NNPDF_POS_2P24GEV_F2S, maxlambda: 1e6}
  - {dataset: NNPDF_POS_2P24GEV_FLL, maxlambda: 1e6}
  - {dataset: NNPDF_POS_2P24GEV_DYU, maxlambda: 1e10}
  - {dataset: NNPDF_POS_2P24GEV_DYD, maxlambda: 1e10}
  - {dataset: NNPDF_POS_2P24GEV_DYS, maxlambda: 1e10}
  - {dataset: NNPDF_POS_2P24GEV_F2C, maxlambda: 1e6}
  # Positivity of MSbar PDFs
  - {dataset: NNPDF_POS_2P24GEV_XUQ, maxlambda: 1e6}
  - {dataset: NNPDF_POS_2P24GEV_XUB, maxlambda: 1e6}
  - {dataset: NNPDF_POS_2P24GEV_XDQ, maxlambda: 1e6}
  - {dataset: NNPDF_POS_2P24GEV_XDB, maxlambda: 1e6}
  - {dataset: NNPDF_POS_2P24GEV_XSQ, maxlambda: 1e6}
  - {dataset: NNPDF_POS_2P24GEV_XSB, maxlambda: 1e6}
  - {dataset: NNPDF_POS_2P24GEV_XGL, maxlambda: 1e6}

positivity_penalty_settings:
  positivity_penalty: true
  alpha: 1e-7                           
  lambda_positivity: 0  

integrability:
  integdatasets:
  - {dataset: NNPDF_INTEG_3GEV_XT8, maxlambda: 1e2}
  - {dataset: NNPDF_INTEG_3GEV_XT3, maxlambda: 1e2}               

use_fit_t0: True                       # Whether the t0 covariance is used in the chi2 loss.
t0pdfset: NNPDF40_nnlo_as_01180         # The t0 PDF used to build the t0 covariance matrix.

#############
# Model specs
#############
# defines which PDF flavours are used in the fit
flavour_mapping: [V, V3, V8, T3, T8, \Sigma, T15, g, photon, V15, V24, V35, T24, T35]

  

###################
# Methodology specs
###################
# prior_settings:
#   prior_distribution: uniform_parameter_prior
#   prior_distribution_specs:
#     max_val: 3.4
#     min_val: 0.0

# integrability_settings:
#   integrability: false  
  
# # Nested Sampling settings
# ns_settings:
#   sampler_plot: true
#   n_posterior_samples: 10
#   ReactiveNS_settings:
#     vectorized: False
#     ndraw_max: 500
#   Run_settings:
#     min_num_live_points: 800
#     min_ess: 50
#     frac_remain: 0.1
#   # SliceSampler_settings:
#   #   nsteps: 106

# Monte Carlo settings
use_gen_t0: True                       # Whether the t0 covariance is used to generated pseudodata.
max_epochs:  10000    # The max number of epochs in Monte Carlo training.
mc_validation_fraction: 0.3           # The fraction of the data used for validation in Monte Carlo training.

mc_initialiser_settings:               # The initialiser for Monte Carlo training.
  type: normal                        # This setting starts with all parameters equal to zero. zeros, normal, uniform
  mean_val: 0.0
  std_val: 0.1

patience: 1000

optimizer_settings:
  optimizer: "adam"
  clipnorm: 1.0
  optimizer_hyperparams:
      learning_rate: 5e-4

actions_:
- run_monte_carlo_fit                    # Choose from ultranest_fit, monte_carlo_fit, analytic_fit
